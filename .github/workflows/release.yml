name: Release 23.05

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: '编译 SDK 版本'
        required: true
        default: '23.05.6'
        type: choice
        options:
          - 21.02.7
          - 22.03.7
          - 23.05.6
          - 24.10.4
      upload_artifact:
        description: '是否上传到 Artifact'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "CPU cores: $(nproc)"
          uname -a
          free -h

      - name: Download SDK
        id: sdk
        run: |
          declare -A sdkMap=(
            ["21.02.7"]="openwrt-sdk-21.02.7-x86-64_gcc-8.4.0_musl"
            ["22.03.7"]="openwrt-sdk-22.03.7-x86-64_gcc-11.2.0_musl"
            ["23.05.6"]="openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl"
            ["24.10.4"]="openwrt-sdk-24.10.4-x86-64_gcc-13.3.0_musl"
          )

          SDK_VER="${{ inputs.sdk_version || '21.02.7' }}"
          SDK="${sdkMap[$SDK_VER]}"

          echo "SDK_VER=$SDK_VER" >> $GITHUB_OUTPUT
          echo "Using SDK: $SDK_VER"

          wget https://archive.openwrt.org/releases/$SDK_VER/targets/x86/64/$SDK.Linux-x86_64.tar.xz
          tar -xf $SDK.Linux-x86_64.tar.xz
          mv $SDK.Linux-x86_64 openwrt-sdk

      - name: Build
        id: build
        run: |
          cd openwrt-sdk

          # 始终从默认分支（js）构建
          REF="${GITHUB_DEFAULT_BRANCH}"
          echo "Build from branch: $REF"

          git clone --depth=1 -b "$REF" \
            https://github.com/papagaye744/luci-theme-design.git \
            package/luci-theme-design

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_luci-theme-design=y" >> .config
          make defconfig
          make package/luci-theme-design/compile -j$(nproc)

          TARGET=$(find bin/ -name "*luci-theme-design*" | head -n 1)
          echo "TARGET=$PWD/$TARGET" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-design-${{ steps.sdk.outputs.SDK_VER }}
          path: ${{ steps.build.outputs.TARGET }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} (SDK ${{ steps.sdk.outputs.SDK_VER }})
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.TARGET }}
            LICENSE
